# Vérifie le code puis publie l'image Docker sur le registre GitLab du projet
# (registry.gitlab.com/btronquoy/nootion).
#   - push sur la branche principale -> tags "main" et "main-<commit>"
#   - tag git "v1.2.3"               -> tags "1.2.3" et "latest"

stages:
  - test
  - image

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

test:
  stage: test
  image: node:22-bookworm-slim
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm typecheck
    - pnpm test

image:
  stage: image
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        TAGS="$VERSION latest"
      else
        VERSION="main-$CI_COMMIT_SHORT_SHA"
        TAGS="$VERSION main"
      fi
      docker pull "$CI_REGISTRY_IMAGE:main" || true
      docker build \
        --cache-from "$CI_REGISTRY_IMAGE:main" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg VERSION="$VERSION" \
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        --label org.opencontainers.image.source="$CI_PROJECT_URL" \
        -f docker/Dockerfile -t "$CI_REGISTRY_IMAGE:$VERSION" .
      for TAG in $TAGS; do
        docker tag "$CI_REGISTRY_IMAGE:$VERSION" "$CI_REGISTRY_IMAGE:$TAG"
        docker push "$CI_REGISTRY_IMAGE:$TAG"
      done
