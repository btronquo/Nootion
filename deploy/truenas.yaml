# Nootion on TrueNAS SCALE (24.10 and later): Apps > Discover Apps > ⋮ > Install via YAML.
# Replace the 3 values marked <-- before saving. Full guide: docs/DEPLOYMENT.md
services:
  nootion:
    # "latest" = last published version. To pin a version: registry.gitlab.com/btronquoy/nootion:1.0.0
    image: registry.gitlab.com/btronquoy/nootion:latest
    pull_policy: always
    container_name: nootion
    restart: unless-stopped
    # TrueNAS "apps" user: the data dataset must belong to it.
    user: "568:568"
    ports:
      - "3000:3000"   # NAS port:container port. Change the first one if 3000 is already taken.
    environment:
      APP_URL: "http://192.168.1.10:3000"                 # <-- address typed in the browser, without a trailing /
      APP_SECRET: "replace-me-with-a-long-random-string"  # <-- openssl rand -hex 32, never change it afterwards
      TZ: "Europe/Paris"
    volumes:
      # SQLite database, attached files, plugins: this is the dataset to back up (ZFS snapshots).
      - /mnt/tank/apps/nootion:/data                      # <-- path of your dataset
