# Nootion with the published image. See docs/DEPLOYMENT.md.
services:
  nootion:
    # "latest" = last released version. To pin a version: ghcr.io/btronquo/nootion:2.0.1
    image: ghcr.io/btronquo/nootion:latest
    # To build from the source code instead (in a clone of the repository):
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    container_name: nootion
    restart: unless-stopped
    # The image runs as UID 1000 ("node" user) by default. With a host folder owned by
    # another user, run as that user instead, e.g.:
    # user: "1001:1001"
    ports:
      - "3000:3000"
    environment:
      # Address where you open Nootion in the browser (without a trailing /).
      APP_URL: "http://localhost:3000"
      # Random string of at least 16 characters, generated once and kept (e.g. openssl rand -hex 32).
      APP_SECRET: "replace-me-with-a-long-random-string"
      TZ: "Europe/Paris"
    volumes:
      # All data (nootion.db database, attached files) in a named Docker volume.
      # For a host folder instead: - /path/to/nootion:/data (the folder must belong to UID 1000).
      - nootion-data:/data

volumes:
  nootion-data:
