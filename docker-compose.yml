# Nootion: build and run from the source code (PC, other NAS, tests).
# For TrueNAS with the published image, use deploy/truenas.yaml instead (see docs/DEPLOYMENT.md).
services:
  nootion:
    image: nootion:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nootion
    restart: unless-stopped
    # The image runs as UID 1000 ("node" user) by default.
    # On TrueNAS, uncomment the next line ("apps" user, UID/GID 568).
    # user: "568:568"
    ports:
      - "3000:3000"
    environment:
      # Address where you open Nootion in the browser (without a trailing /).
      APP_URL: "http://localhost:3000"
      # Random string of at least 16 characters, generated once and kept (e.g. openssl rand -hex 32).
      APP_SECRET: "replace-me-with-a-long-random-string"
      TZ: "Europe/Paris"
    volumes:
      # All data (nootion.db database, attached files) in a named Docker volume.
      # For a host folder instead: - /path/to/nootion:/data (the folder must belong to UID 1000).
      - nootion-data:/data

volumes:
  nootion-data:
