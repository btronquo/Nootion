# Nootion : construction et lancement depuis le code source (PC, autre NAS, tests).
# Pour TrueNAS avec l'image publiée, utilisez plutôt deploy/truenas.yaml (voir docs/DEPLOIEMENT.md).
services:
  nootion:
    image: nootion:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nootion
    restart: unless-stopped
    # L'image tourne par défaut avec l'UID 1000 (utilisateur "node").
    # Sur TrueNAS, décommentez la ligne suivante (utilisateur "apps", UID/GID 568).
    # user: "568:568"
    ports:
      - "3000:3000"
    environment:
      # Adresse à laquelle vous ouvrez Nootion dans le navigateur (sans / final).
      APP_URL: "http://localhost:3000"
      # Chaîne aléatoire d'au moins 16 caractères, à générer une fois et à garder (ex. : openssl rand -hex 32).
      APP_SECRET: "remplacez-moi-par-une-longue-chaine-aleatoire"
      TZ: "Europe/Paris"
    volumes:
      # Toutes les données (base nootion.db, fichiers joints) dans un volume Docker nommé.
      # Pour un dossier de l'hôte à la place : - /chemin/vers/nootion:/data (le dossier doit appartenir à l'UID 1000).
      - nootion-data:/data

volumes:
  nootion-data:
