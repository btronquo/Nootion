# Checks the code, then publishes the Docker image to the GitHub registry (ghcr.io/btronquo/nootion: the action lowercases the repository name).
# Branches follow git flow (see CONTRIBUTING.md):
#   - pull request        -> tests only
#   - push to main        -> tests only (main only gets merged releases and hotfixes)
#   - push to develop     -> tags "develop" and "develop-<commit>"
#   - git tag "v1.2.3"    -> tags "1.2.3", "1.2" and "latest"
name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Known vulnerabilities in what ships in the image. Development tools are left out.
      - run: pnpm audit --prod --audit-level high
      # Text of attached PDFs and OCR of images, as in the Docker image. If Ubuntu's servers can't be reached, the PDF and
      # OCR tests are skipped rather than failing the whole run.
      - name: PDF and OCR tools
        id: ocr
        continue-on-error: true
        timeout-minutes: 6
        uses: ./.github/actions/apt-install
        with:
          packages: poppler-utils tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
      - if: steps.ocr.outcome == 'failure'
        run: echo "::warning::Ubuntu's package servers can't be reached, the PDF and OCR tests are skipped."
      - run: pnpm test
        env:
          NOOTION_SKIP_OCR: ${{ steps.ocr.outcome == 'failure' && '1' || '' }}

  docker-image:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=develop-,enable=${{ github.ref == 'refs/heads/develop' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
