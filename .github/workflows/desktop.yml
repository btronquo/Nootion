# The desktop app (apps/desktop): checks on every change to it, installers for Windows, macOS and Linux on a tag.
#   - pull request or push touching apps/desktop -> Rust format, lints and tests
#   - git tag "desktop-v1.2.3", or "Run workflow"  -> builds the three platforms and attaches them to a draft release
#
# The installers are not signed yet: Windows shows a SmartScreen warning and macOS asks to open the app from
# System Settings > Privacy & Security. Signing is set up by adding the secrets listed at the bottom of this file.
name: Desktop

on:
  push:
    branches: [main, develop]
    tags: ["desktop-v*"]
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile --filter @nootion/desktop
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing, once the secrets exist (Settings > Secrets and variables > Actions):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                 # Developer ID Application .p12, base64
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}       # "Developer ID Application: Name (TEAMID)"
          # APPLE_ID: ${{ secrets.APPLE_ID }}                                   # notarization
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                       # app-specific password
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Nootion Desktop ${{ github.ref_name }}"
          releaseBody: "Installers for Windows (.exe, .msi), macOS (.dmg) and Linux (.AppImage, .deb, .rpm)."
          releaseDraft: true
          prerelease: true
      # Without a tag ("Run workflow"), the installers are kept as the run's artifacts instead of a release.
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: nootion-desktop-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/**/release/bundle/
          if-no-files-found: error
