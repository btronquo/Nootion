# The desktop app (apps/desktop): checks on every change to it, installers for Windows, macOS and Linux on a tag.
#   - pull request or push touching apps/desktop -> Rust format, lints and tests
#   - git tag "v1.2.3" (a Nootion release)          -> builds the three platforms and attaches them to that version's
#                                                     GitHub release (created as a draft if it doesn't exist yet)
#   - git tag "desktop-v1.2.3", or "Run workflow"  -> same, as a separate draft pre-release (tests of the app)
#
# macOS installers are signed with a Developer ID certificate and notarized by Apple (the APPLE_* secrets below).
# Windows installers are signed by SignPath (free code signing for open source projects): built here, sent to
# SignPath, then put in place of the unsigned ones. On until the SIGNPATH_ORGANIZATION_ID variable exists.
# See docs/DESKTOP.md#signing.
name: Desktop

on:
  push:
    branches: [main, develop]
    tags: ["v*", "desktop-v*"]
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # The local server and Node are only needed to build installers: empty stand-ins are enough to compile.
      - run: mkdir -p ../local-server binaries && touch binaries/nootion-node-x86_64-unknown-linux-gnu
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One build per system and processor: the local server's native modules (SQLite) are built for it.
          - platform: macos-latest # Apple chips
          - platform: macos-15-intel # Intel Macs
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # The whole workspace: the installers ship the server and the web app (scripts/prepare-local-server.mjs).
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing and notarization (Settings > Secrets and variables > Actions); unused on Windows and Linux.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                   # Developer ID Application .p12, base64
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}         # "Developer ID Application: Name (TEAMID)"
          APPLE_ID: ${{ secrets.APPLE_ID }}                                     # notarization
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                         # app-specific password
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          # A Nootion release (v1.2.3) gets the installers in its own release; its notes are written by hand.
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Nootion {0}', github.ref_name) || format('Nootion Desktop {0}', github.ref_name) }}
          releaseBody: "Installers for Windows (.exe, .msi), macOS (.dmg, Apple chips and Intel) and Linux (.AppImage, .deb, .rpm)."
          releaseDraft: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      # Windows: the installers go to SignPath to be signed. A release (v1.2.3) waits for a person to approve the
      # request on SignPath; other builds use the test policy. Signed, they replace the unsigned files.
      - if: matrix.platform == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: nootion-windows-unsigned
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - if: matrix.platform == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'nootion' }}
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: windows-installers
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Time for the approval of a release.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
      - if: matrix.platform == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" signed/nsis/*.exe signed/msi/*.msi --clobber --repo "${{ github.repository }}"
      - if: matrix.platform == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nootion-desktop-windows-signed
          path: signed/
          if-no-files-found: error
      # Without a tag ("Run workflow"), the installers are kept as the run's artifacts instead of a release.
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: nootion-desktop-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/**/release/bundle/
          if-no-files-found: error
